name: Data engineering pipeline

on:
  push:
    paths:
      - "Data Engineering Projects/Sales CRM Analytics Pipeline/**"
      - ".github/workflows/data-engineering-pipeline.yml"
  pull_request:
    paths:
      - "Data Engineering Projects/Sales CRM Analytics Pipeline/**"
      - ".github/workflows/data-engineering-pipeline.yml"
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_crm
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_user -d sales_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: Data Engineering Projects/Sales CRM Analytics Pipeline

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sales_crm
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_dev_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Data Engineering Projects/Sales CRM Analytics Pipeline/pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest

      - name: Run Python quality checks
        run: ruff check src tests

      - name: Generate synthetic source batches
        run: >-
          python -m sales_crm_pipeline generate
          --companies 80
          --contacts 200
          --orders 800
          --batches 3
          --overwrite

      - name: Load PostgreSQL raw layer
        run: python -m sales_crm_pipeline load

      - name: Build and test dbt models
        run: dbt build --profiles-dir .
