sales_crm_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '55432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'portfolio_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'portfolio_dev_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'sales_crm') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
