version: 2

models:
  - name: int_company_matches
    description: Best deterministic CRM-to-ERP match with an auditable method and confidence score.
    columns:
      - name: crm_company_id
        tests: [not_null, unique]
      - name: erp_customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_erp_customers')
                field: customer_id
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ['external_id', 'domain', 'normalized_name_and_state']
